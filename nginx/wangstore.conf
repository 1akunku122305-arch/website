# WangStore — site virtual host (reverse proxy to the Next.js app)

upstream wangstore_app {
    server app:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# HTTP: ACME challenge + permanent redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wangstore.id www.wangstore.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wangstore.id www.wangstore.id;

    ssl_certificate     /etc/letsencrypt/live/wangstore.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wangstore.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Security headers --------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- Global limits -----------------------------------------------------
    limit_conn perip 24;
    limit_conn perserver 2000;
    limit_req  zone=general burst=60 nodelay;

    if ($bad_bot) { return 403; }
    if ($bad_method) { return 405; }

    # Block hidden files and common probe paths
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|\.env|\.git) { deny all; }

    # --- Login: strictest limit -------------------------------------------
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://wangstore_app;
        include /etc/nginx/proxy-params.conf;
    }

    # --- API --------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://wangstore_app;
        include /etc/nginx/proxy-params.conf;
    }

    # --- Immutable build assets -------------------------------------------
    location /_next/static/ {
        proxy_pass http://wangstore_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/proxy-params.conf;
    }

    location / {
        proxy_pass http://wangstore_app;
        include /etc/nginx/proxy-params.conf;
    }
}

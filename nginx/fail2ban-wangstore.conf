# ---------------------------------------------------------------------------
# Fail2Ban configuration for WangStore
#
# Install:
#   cp nginx/fail2ban-wangstore.conf /etc/fail2ban/jail.d/wangstore.local
#   cp nginx/filter-wangstore-*.conf /etc/fail2ban/filter.d/
#   systemctl restart fail2ban
# ---------------------------------------------------------------------------

[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5
backend  = auto
banaction = iptables-multiport
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled  = true
port     = ssh
maxretry = 3
bantime  = 24h

[nginx-http-auth]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/error.log

[nginx-limit-req]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/error.log
maxretry = 10
findtime = 5m
bantime  = 2h

[nginx-badbots]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/access.log
maxretry = 2
bantime  = 24h

[wangstore-login]
enabled  = true
port     = http,https
filter   = wangstore-login
logpath  = /var/log/nginx/access.log
maxretry = 6
findtime = 5m
bantime  = 6h

[wangstore-probe]
enabled  = true
port     = http,https
filter   = wangstore-probe
logpath  = /var/log/nginx/access.log
maxretry = 4
findtime = 10m
bantime  = 24h

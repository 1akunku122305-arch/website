# WangStore — hardened Nginx base configuration
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # --- Hardening ---------------------------------------------------------
    server_tokens        off;
    client_max_body_size 12m;
    client_body_timeout  12s;
    client_header_timeout 12s;
    send_timeout         12s;
    large_client_header_buffers 4 16k;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 30;
    keepalive_requests 200;
    reset_timedout_connection on;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss application/atom+xml image/svg+xml;

    # --- Rate limiting zones (DDoS / abuse mitigation, layer 7) ------------
    limit_req_zone  $binary_remote_addr zone=general:20m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m   rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name        zone=perserver:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # --- Bot / abuse detection --------------------------------------------
    map $http_user_agent $bad_bot {
        default                 0;
        ""                      1;
        "~*(nikto|sqlmap|nmap|masscan|zgrab|dirbuster|wpscan)"  1;
        "~*(semrush|ahrefs|mj12bot|dotbot|petalbot)"            1;
    }

    map $request_method $bad_method {
        default 1;
        GET     0;
        HEAD    0;
        POST    0;
        PUT     0;
        DELETE  0;
        OPTIONS 0;
    }

    # --- Real client IP behind Cloudflare ----------------------------------
    # Refresh with: curl -s https://www.cloudflare.com/ips-v4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/conf.d/*.conf;
}

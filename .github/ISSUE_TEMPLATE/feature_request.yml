name: Feature request
description: Suggest an improvement to WangStore
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation are you hitting today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Landing pages
        - Server Builder / pricing
        - Admin dashboard
        - Customer portal
        - Infrastructure / deployment
        - Documentation
    validations:
      required: true

name: CI

# AKTIVASI:
# Repo GitHub App/pat perlu izin "Workflows" (Settings > Actions > General
# > Workflow permissions). Salin file ini ke .github/workflows/ci.yml,
# lalu commit. Tanpa izin "workflows", GitHub menolak membuat/update
# file di .github/workflows/.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  test:
    name: Unit & Business Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
